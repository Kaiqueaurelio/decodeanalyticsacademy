name: Fix Ella apostila action

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'Kaiqueaurelio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin apostila fallback and Ella prompt flow
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pagePath = 'src/pages/ApostilaPage.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');

          if (!page.includes("import { EllaChat } from '@/components/ella/EllaChat';")) {
            page = page.replace(
              "import { ApostilaChat } from '@/components/ApostilaChat';",
              "import { ApostilaChat } from '@/components/ApostilaChat';\nimport { EllaChat } from '@/components/ella/EllaChat';"
            );
          }

          if (!page.includes('const [ellaOpen, setEllaOpen] = useState(false);')) {
            page = page.replace(
              "  const [chatOpen, setChatOpen] = useState(false);\n  const [exportingPdf, setExportingPdf] = useState(false);",
              "  const [chatOpen, setChatOpen] = useState(false);\n  const [ellaOpen, setEllaOpen] = useState(false);\n  const [ellaPrompt, setEllaPrompt] = useState('');\n  const [exportingPdf, setExportingPdf] = useState(false);"
            );
          }

          page = page.replace(
            "(!organizedSections.length || organizedSections.every(s => s.isPlaceholder)) ? (",
            "contentBlocks.length === 0 ? ("
          );

          const handlerPattern = /onClick=\{\(\) => \{\s*toast\.info\("Ella Ribeiro está iniciando a correção deste material\.\.\."\);\s*setChatOpen\(true\);\s*setTimeout\(\(\) => \{[\s\S]*?\}, 500\);\s*\}\}/m;
          if (handlerPattern.test(page)) {
            page = page.replace(handlerPattern, `onClick={() => {\n                              const prompt = 'Preciso que você resolva as pendências desta apostila "' + apostila.title + '". Ela está vazia ou incompleta. Estruture o conteúdo, adicione glossário e exercícios de fixação agora.';\n                              toast.info("Ella Ribeiro está iniciando a correção deste material...");\n                              setEllaPrompt(prompt);\n                              setEllaOpen(true);\n                            }}`);
          }

          const chatMarker = '        {/* Chat Sheet */}\n        <Sheet open={chatOpen} onOpenChange={setChatOpen}>';
          const ellaSheet = `        {/* Ella Sheet — usado pelo fluxo administrativo de resolução de pendências */}\n        <Sheet open={ellaOpen} onOpenChange={setEllaOpen}>\n          <SheetContent side="right" className="w-full sm:max-w-lg lg:max-w-xl p-0 flex flex-col gap-0 border-l border-primary/20">\n            <div className="flex-1 overflow-hidden">\n              <EllaChat\n                initialPrompt={ellaPrompt}\n                contextHint={'Apostila em manutenção: ' + apostila.title + ' (ID: ' + id + '). O administrador acionou Resolver Pendências.'}\n              />\n            </div>\n          </SheetContent>\n        </Sheet>\n\n`;
          if (!page.includes(ellaSheet)) {
            if (!page.includes(chatMarker)) throw new Error('Não foi possível localizar o Chat Sheet da ApostilaPage.');
            page = page.replace(chatMarker, ellaSheet + chatMarker);
          }

          fs.writeFileSync(pagePath, page);

          const ellaPath = 'src/components/ella/EllaChat.tsx';
          let ella = fs.readFileSync(ellaPath, 'utf8');
          if (!ella.includes('initialPrompt?: string;')) {
            ella = ella.replace(
              `interface EllaChatProps {\n  contextHint?: string;`,
              `interface EllaChatProps {\n  contextHint?: string;\n  initialPrompt?: string;`
            );
          }
          ella = ella.replace(
            `export function EllaChat({ contextHint, compact, onAfterAction }: EllaChatProps) {`,
            `export function EllaChat({ contextHint, initialPrompt, compact, onAfterAction }: EllaChatProps) {`
          );
          if (!ella.includes('initialPromptSentRef')) {
            ella = ella.replace(
              `  const scrollRef = useRef<HTMLDivElement>(null);\n\n  useEffect(() => {`,
              `  const scrollRef = useRef<HTMLDivElement>(null);\n  const initialPromptSentRef = useRef<string | null>(null);\n\n  useEffect(() => {`
            );
          }
          if (!ella.includes('initialPromptSentRef.current === initialPrompt')) {
            const marker = `  useEffect(() => {\n    taRef.current?.focus();\n  }, []);`;
            const effect = `  useEffect(() => {\n    if (!initialPrompt || !user || initialPromptSentRef.current === initialPrompt) return;\n    initialPromptSentRef.current = initialPrompt;\n    void send(initialPrompt);\n  }, [initialPrompt, user, send]);\n\n`;
            if (!ella.includes(marker)) throw new Error('Não foi possível localizar o ponto seguro para o prompt inicial da Ella.');
            ella = ella.replace(marker, effect + marker);
          }
          fs.writeFileSync(ellaPath, ella);
          NODE

      - name: Validate
        run: |
          npm ci
          npm exec -- tsc --noEmit

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ApostilaPage.tsx src/components/ella/EllaChat.tsx .github/workflows/fix-ella-apostila.yml
          git commit -m "fix: make admin Ella apostila repair action reliable"
          git rm .github/workflows/fix-ella-apostila.yml
          git commit -m "chore: remove one-shot Ella fix workflow"
          git push