name: Stabilize workbench persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-workbench:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch workbench persistence
        env:
          WORKBENCH: src/pages/AdminApostilaWorkbench.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ['WORKBENCH'])
          text = path.read_text()
          changed = False

          replacements = [
              ('const AUTOSAVE_MS = 1000;', 'const AUTOSAVE_MS = 1500;'),
              ('void persistChanges();', 'void doSave();'),
              ('beforeCreate={() => persistChanges(false)}', 'beforeCreate={() => doSave(false)}'),
              ("const linksRes = results[1].status === 'fulfilled' ? results[1].value : { data: [], error: null };", "const linksRes = results[1].status === 'fulfilled' ? results[1].value : { data: null, error: new Error('Falha ao carregar materiais da apostila.') } as any;"),
              ("const countRes = results[2].status === 'fulfilled' ? results[2].value : { count: 0 };", "const countRes = results[2].status === 'fulfilled' ? results[2].value : { count: 0, error: new Error('Falha ao carregar exercícios da apostila.') } as any;"),
              ("    const ap = apRes.data;\n    const links = linksRes.data;\n    const count = countRes.count;", "    const loadErrors = [apRes.error, linksRes.error, countRes.error].filter(Boolean);\n    if (loadErrors.length > 0) {\n      console.error('[Workbench] Falha ao carregar dados da apostila:', loadErrors);\n      toast.error('Não foi possível carregar todos os dados desta apostila. A edição foi mantida para evitar perda de conteúdo.');\n      setLoading(false);\n      return;\n    }\n\n    const ap = apRes.data;\n    const links = linksRes.data;\n    const count = countRes.count;"),
              ("    const { data: pageRows } = await (supabase.from('apostila_pages' as any) as any)\n      .select('*').eq('apostila_id', apostilaId).order('position');\n    if (!isCurrentRequest()) return;", "    const { data: pageRows, error: pagesError } = await (supabase.from('apostila_pages' as any) as any)\n      .select('*').eq('apostila_id', apostilaId).order('position');\n    if (!isCurrentRequest()) return;\n    if (pagesError) {\n      console.error('[Workbench] Falha ao carregar páginas:', pagesError);\n      toast.error('Não foi possível carregar as páginas desta apostila.');\n      setLoading(false);\n      return;\n    }"),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True

          if not changed:
              print('Workbench hardening already applied.')
          else:
              path.write_text(text)
          PY

      - name: Validate changed workbench
        run: |
          npm ci
          npm exec -- tsc --noEmit
          npm test -- --runInBand
          npm exec -- vite build -- --minify false

      - name: Commit hardened workbench
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminApostilaWorkbench.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: surface workbench load errors"
          git push origin HEAD:main
