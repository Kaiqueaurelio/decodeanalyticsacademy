name: Fix apostila responsiveness

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'Kaiqueaurelio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch responsive layout
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/pages/ApostilaPage.tsx')
          s = p.read_text()
          s = s.replace('<div className={`min-h-screen bg-background relative overflow-x-hidden ${focusMode ? \'focus-mode\' : \'\'}`}>', '<div className={`apostila-page-shell min-h-screen bg-background relative overflow-x-hidden ${focusMode ? \'focus-mode\' : \'\'}`}>')
          s = s.replace('<div className="flex items-center justify-between">\n            <Button variant="ghost"', '<div className="flex flex-wrap items-center justify-between gap-2">\n            <Button variant="ghost"')
          s = s.replace('<div className="flex items-center gap-2">\n              {isMobile && sections.length > 1 && (', '<div className="apostila-action-bar flex flex-wrap items-center justify-end gap-1.5 sm:gap-2 min-w-0">\n              {isMobile && sections.length > 1 && (')
          s = s.replace('<div className="flex items-center gap-1 sm:gap-2">\n                  <Sheet', '<div className="flex flex-wrap items-center gap-1 sm:gap-2">\n                  <Sheet')
          s = s.replace('<div className={`grid gap-8 ${', '<div className={`apostila-layout-grid grid gap-8 ${')
          p.write_text(s)

          css = r'''/* Responsive contract for the apostila reader. */
          .apostila-page-shell { width: 100%; max-width: 100vw; overflow-x: clip; }
          .apostila-page-shell main, .apostila-page-shell article, .apostila-page-shell aside, .apostila-page-shell section { min-width: 0; }
          .apostila-page-shell .apostila-action-bar { flex: 1 1 auto; }
          .apostila-page-shell .apostila-layout-grid { grid-template-columns: minmax(0, 1fr) 240px; }
          @media (min-width: 1280px) {
            .apostila-page-shell .apostila-layout-grid { grid-template-columns: 210px minmax(0, 1fr) 260px; }
          }
          @media (max-width: 1279px) {
            .apostila-page-shell .apostila-layout-grid > aside:first-child { display: none; }
          }
          @media (max-width: 1023px) {
            .apostila-page-shell .apostila-layout-grid { grid-template-columns: minmax(0, 1fr); }
            .apostila-page-shell .apostila-layout-grid > aside:last-child { order: 2; }
            .apostila-page-shell #conteudo-principal { max-width: 100%; }
          }
          @media (max-width: 767px) {
            .apostila-page-shell .apostila-action-bar { width: 100%; justify-content: flex-start; }
            .apostila-page-shell h1 { overflow-wrap: anywhere; }
            .apostila-page-shell .apostila-continuous-flow { overflow-wrap: anywhere; }
            .apostila-page-shell pre, .apostila-page-shell .shiki-wrapper, .apostila-page-shell table { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
          }
          @media (max-width: 480px) {
            .apostila-page-shell .apostila-action-bar button { min-height: 2.25rem; }
            .apostila-page-shell #conteudo-principal > section > header { padding: 0.75rem; }
          }
          '''
          Path('src/styles/apostila-responsive.css').write_text(css)

          m = Path('src/main.tsx')
          main = m.read_text()
          if 'import "./styles/apostila-responsive.css";' not in main:
              main = main.replace('import "./index.css";', 'import "./index.css";\nimport "./styles/apostila-responsive.css";')
              m.write_text(main)
          PY

      - name: Validate
        run: |
          npm ci
          npm exec -- tsc --noEmit
          npm run build

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ApostilaPage.tsx src/main.tsx src/styles/apostila-responsive.css
          git commit -m "fix: make apostila reader responsive across breakpoints"
          git rm .github/workflows/fix-apostila-responsive.yml
          git commit -m "chore: remove one-shot responsive workflow"
          git push
