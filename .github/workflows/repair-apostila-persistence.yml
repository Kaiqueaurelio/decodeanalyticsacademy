name: Repair apostila persistence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Workbench safety guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminApostilaWorkbench.tsx')
          s = p.read_text()
          old = """    const { data: currentApostila } = await supabase
      .from('apostilas')
      .select('title, content')
      .eq('id', id)
      .single();

    if (currentApostila?.content?.trim() && !content.trim()) {"""
          new = """    const { data: currentApostila, error: currentApostilaError } = await supabase
      .from('apostilas')
      .select('title, content, content_revision')
      .eq('id', id)
      .single();

    if (currentApostilaError) {
      console.error('[Workbench] Falha ao confirmar a versão atual antes do save:', currentApostilaError);
      setSaving(false);
      void recordApostilaOperation({
        operationId,
        apostilaId: id,
        operationType,
        phase: 'save',
        status: 'failed',
        errorCode: currentApostilaError.code || 'pre_save_read_failed',
        errorMessage: currentApostilaError.message,
        metadata: { reason: 'current_version_read_failed' },
      });
      toast.error('Não foi possível confirmar a versão atual. A edição não foi sobrescrita.');
      return false;
    }

    if (currentApostila?.content?.trim() && !content.trim()) {"""
          if old not in s:
            raise SystemExit('pre-save block not found')
          s = s.replace(old, new, 1)
          old2 = """    if (currentApostila && (currentApostila.content !== content || currentApostila.title !== title)) {
      await supabase.from('apostila_versions').insert({
        apostila_id: id,
        title: currentApostila.title,
        content: currentApostila.content,
        created_by: user?.id
      });
    }"""
          new2 = """    if (currentApostila && (currentApostila.content !== content || currentApostila.title !== title)) {
      const { error: versionError } = await supabase.from('apostila_versions').insert({
        apostila_id: id,
        title: currentApostila.title,
        content: currentApostila.content,
        created_by: user?.id
      });
      if (versionError) {
        console.warn('[Workbench] Não foi possível criar o snapshot histórico; o save principal continuará:', versionError);
      }
    }"""
          if old2 not in s:
            raise SystemExit('version block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit Workbench fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminApostilaWorkbench.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: block unsafe apostila saves on read failure'
          git push
      - name: Remove runner
        if: success()
        run: |
          git rm .github/workflows/repair-apostila-persistence.yml
          git commit -m 'chore: remove controlled repair runner'
          git push
