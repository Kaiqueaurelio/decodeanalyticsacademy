name: One-shot workbench repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-workbench-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch workbench safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminApostilaWorkbench.tsx')
          s = p.read_text()
          replacements = {
            "const linksRes = results[1].status === 'fulfilled' ? results[1].value : { data: [], error: null };": "const linksRes = results[1].status === 'fulfilled' ? results[1].value : { data: null, error: new Error('Falha ao carregar materiais da apostila.') } as any;",
            "const countRes = results[2].status === 'fulfilled' ? results[2].value : { count: 0 };": "const countRes = results[2].status === 'fulfilled' ? results[2].value : { count: 0, error: new Error('Falha ao carregar exercícios da apostila.') } as any;",
            "  if (!isCurrentRequest()) return;\n\n    const ap = apRes.data;": "  if (!isCurrentRequest()) return;\n\n    const loadErrors = [apRes.error, linksRes.error, countRes.error].filter(Boolean);\n    if (loadErrors.length > 0) {\n      console.error('[Workbench] Falha ao carregar dados da apostila:', loadErrors);\n      toast.error('Não foi possível carregar todos os dados desta apostila.');\n      setLoading(false);\n      return;\n    }\n\n    const ap = apRes.data;",
            "const { data: pageRows } = await (supabase.from('apostila_pages' as any) as any)\n      .select('*').eq('apostila_id', apostilaId).order('position');\n    if (!isCurrentRequest()) return;": "const { data: pageRows, error: pagesError } = await (supabase.from('apostila_pages' as any) as any)\n      .select('*').eq('apostila_id', apostilaId).order('position');\n    if (!isCurrentRequest()) return;\n    if (pagesError) {\n      console.error('[Workbench] Falha ao carregar páginas:', pagesError);\n      toast.error('Não foi possível carregar as páginas desta apostila.');\n      setLoading(false);\n      return;\n    }",
            "      const { data } = await supabase\n        .from('apostilas')\n        .select('id, title, category, published, updated_at, semester, course')\n        .order('updated_at', { ascending: false })\n        .limit(200);\n      setApostilas((data as ApostilaLite[]) || []);": "      const { data, error } = await supabase\n        .from('apostilas')\n        .select('id, title, category, published, updated_at, semester, course')\n        .order('updated_at', { ascending: false })\n        .limit(200);\n      if (error) {\n        console.error('[Workbench] Falha ao carregar lista de apostilas:', error);\n        toast.error('Não foi possível carregar a lista de apostilas.');\n        return;\n      }\n      setApostilas((data as ApostilaLite[]) || []);",
            "{id && <NewApostilaPageButton apostilaId={id} beforeCreate={() => persistChanges(false)} />}": "{id && <NewApostilaPageButton apostilaId={id} beforeCreate={() => doSave(false)} />}",
            "    const { data: links } = await supabase\n      .from('apostila_materials').select('id, sort_order, material_id')\n      .eq('apostila_id', id).order('sort_order');\n    if (!links?.length) { setLinkedMaterials([]); return; }": "    const { data: links, error: linksError } = await supabase\n      .from('apostila_materials').select('id, sort_order, material_id')\n      .eq('apostila_id', id).order('sort_order');\n    if (linksError) {\n      console.error('[Workbench] Falha ao recarregar materiais:', linksError);\n      toast.error('Não foi possível atualizar os materiais.');\n      return;\n    }\n    if (!links?.length) { setLinkedMaterials([]); return; }",
          }
          changed = []
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new, 1)
              changed.append(old[:70])
          p.write_text(s)
          print(f'Aplicados {len(changed)} patches.')
          PY

      - name: Validate
        run: |
          npm ci
          npm exec -- tsc --noEmit
          npm test
          npm exec -- vite build -- --minify false

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminApostilaWorkbench.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: surface workbench persistence and load failures"
          git push origin HEAD:main
