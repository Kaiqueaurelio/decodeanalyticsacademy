name: Fix student apostila fallback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect admin-only fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ApostilaPage.tsx')
          s = p.read_text()
          old = '                {user && (\n                  (!organizedSections.length || organizedSections.every(s => s.isPlaceholder)) ? ('
          new = '                {isAdmin && (\n                  (!organizedSections.length || organizedSections.every(s => s.isPlaceholder)) ? ('
          if old not in s:
              raise SystemExit('Target condition not found; refusing to modify file')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/fix-student-placeholder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ApostilaPage.tsx .github/workflows/fix-student-placeholder.yml
          git commit -m "fix: hide apostila pending fallback from students"
          git push
