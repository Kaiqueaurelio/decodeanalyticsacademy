name: Validate app

on:
  push:
    branches: [main, develop/v1.1.0-dev]
  pull_request:
    branches: [main, develop/v1.1.0-dev]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm exec -- tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm exec -- vite build -- --minify false

      - name: Verify generated MCP matches production source
        run: |
          npm exec -- vitest run src/test/mcp-backend-invariant.test.ts
          git diff --exit-code -- supabase/functions/mcp/index.ts
