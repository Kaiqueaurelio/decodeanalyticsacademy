name: Validate app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -- tsc --noEmit
      - run: npm test
      - run: npm exec -- vite build -- --minify false
      - name: Verify generated MCP artifact
        run: git diff --exit-code -- supabase/functions/mcp/index.ts
