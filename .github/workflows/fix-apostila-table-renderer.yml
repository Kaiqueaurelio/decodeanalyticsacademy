name: Apply apostila table renderer fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fix-apostila-table-renderer.cjs
      - run: npx vitest run src/components/ApostilaContentRenderer.test.tsx
      - run: npm run build
      - run: |
          rm scripts/fix-apostila-table-renderer.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ApostilaContentRenderer.tsx src/components/ApostilaContentRenderer.test.tsx scripts/fix-apostila-table-renderer.cjs .github/workflows/fix-apostila-table-renderer.yml
          git commit -m "fix: render apostila table cell fragments" || exit 0
          git push
